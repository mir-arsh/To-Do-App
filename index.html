<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">To Do List</h1>
            <p class="header-subtitle">Stay organized and productive</p>
        </div>
        <div class="header-stats">
            <span class="stat-item">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="totalCount">0</span>
            </span>
            <span class="stat-item">
                <span class="stat-label">Active</span>
                <span class="stat-value" id="activeCount">0</span>
            </span>
            <span class="stat-item">
                <span class="stat-label">Completed</span>
                <span class="stat-value" id="completedCount">0</span>
            </span>
        </div>
    </header>

    <main class="app-container">
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button id="add" class="btn-add" title="Add task (or press Enter)">+</button>
            </div>
        </div>

        <div class="controls-section">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button class="btn-clear-all" id="clearCompleted" title="Clear all completed tasks">Clear Completed</button>
        </div>

        <ul id="todo-list"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
